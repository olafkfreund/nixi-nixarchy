<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omarchy Helper</title>
<style>
  :root { --bg:#16130d; --panel:#211c13; --line:#3a3223; --ink:#ece7d8; --muted:#9a917d; --ember:#ffb454; --bot:#2a2417; --me:#3d3116; }
  * { box-sizing:border-box; scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar { display:none; }
  html, body { overflow:hidden; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .avatar { width:34px; height:34px; }
  header h1 { font-size:0.95rem; margin:0; }
  header p { font-size:0.72rem; margin:0; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  /* scrolling without the visible bar */
  #chat { scrollbar-width:none; -ms-overflow-style:none; }
  #chat::-webkit-scrollbar { display:none; }
  .msg { max-width:86%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start; display:flex; gap:8px; }
  .bot .avatar { width:22px; height:22px; flex:none; margin-top:2px; }
  .me { background:var(--me); border:1px solid var(--line); border-bottom-right-radius:4px; align-self:flex-end; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 1.5px; border-radius:50%; background:var(--ember); animation:b 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
  form { display:flex; gap:8px; padding:12px; background:var(--panel); border-top:1px solid var(--line); }
  input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; color:var(--ink); font:inherit; outline:none; }
  input:focus { border-color:var(--ember); }
  input:disabled { opacity:.5; }
  #mini { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:2px 10px; font-weight:700; line-height:1.4; }
  #mini:hover { color:var(--ember); border-color:var(--ember); }
  .hint { align-self:center; color:var(--muted); font-size:0.72rem; }
  .src { display:block; margin-top:5px; font-size:0.68rem; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:2px 2px 6px; }
  .chip { background:var(--bot); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:5px 11px; font-size:0.78rem; cursor:pointer; text-align:left; }
  .chip:hover { border-color:var(--ember); color:var(--ember); }
  .cat { width:100%; margin:4px 2px 0; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
  .deeper { display:inline-block; margin-top:6px; font-size:0.74rem; color:var(--ember); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }
/*__THEME__*/
</style></head>
<body>
<svg style="display:none"><symbol id="bot" viewBox="0 0 48 48">
  <rect x="10" y="14" width="28" height="22" rx="7" style="fill:var(--bot);stroke:var(--ember)" stroke-width="2.2"/>
  <circle cx="19" cy="25" r="3.2" style="fill:var(--ember)"/><circle cx="29" cy="25" r="3.2" style="fill:var(--ember)"/>
  <path d="M18 31.5c2 1.8 10 1.8 12 0" style="stroke:var(--ember)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="24" y1="14" x2="24" y2="8" style="stroke:var(--ember)" stroke-width="2.2"/><circle cx="24" cy="6.5" r="2.4" style="fill:var(--ember)"/>
  <line x1="10" y1="24" x2="5" y2="24" style="stroke:var(--ember)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="43" y2="24" style="stroke:var(--ember)" stroke-width="2.2" stroke-linecap="round"/>
</symbol></svg>
<header>
  <svg class="avatar"><use href="#bot"/></svg>
  <div style="flex:1"><h1>Omarchy Helper</h1><p>ask me anything about your system</p></div>
  <button id="mini" title="Minimize (bring back with your helper key)" aria-label="Minimize">&#8212;</button>
</header>
<div id="chat">
  <div class="msg bot"><svg class="avatar"><use href="#bot"/></svg><div>__GREETING__</div></div>
  <div class="hint">__HINT__</div>
</div>
<form id="f">
  <input id="q" autocomplete="off" placeholder="Type a question and press Enter…" autofocus>
</form>
<script>
// Theme palette is baked in server-side (no flash).
document.getElementById('mini').addEventListener('click', () =>
  fetch('/minimize', { method: 'POST' }).catch(() => {}));
const chat = document.getElementById('chat'), form = document.getElementById('f'),
      input = document.getElementById('q');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (cls === 'bot') d.innerHTML = '<svg class="avatar"><use href="#bot"/></svg><div></div>', d.lastChild.textContent = text;
  else d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
let FAQ = [];
fetch('/faq').then(r => r.json()).then(f => {
  if (f && f.ready) return;               // agent connected: no starter chips
  FAQ = (f && f.faq) || f || [];
  if (!FAQ.length) return;
  const box = document.createElement('div'); box.className = 'chips';
  let lastCat = null;
  FAQ.forEach((e) => {
    if (e.cat !== lastCat) {
      const c = document.createElement('div'); c.className = 'cat'; c.textContent = e.cat;
      box.appendChild(c); lastCat = e.cat;
    }
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = e.q;
    b.addEventListener('click', () => {
      add('me', e.q);
      const t = add('bot', e.a);
      const badge = document.createElement('span'); badge.className = 'src';
      badge.textContent = '📖 quick answer · type anything for the AI';
      t.lastChild.appendChild(badge);
      chat.scrollTop = chat.scrollHeight;
    });
    box.appendChild(b);
  });
  chat.insertBefore(box, chat.children[1] || null);
}).catch(() => {});

async function ask(q) {
  input.disabled = true;
  const t = add('bot', ''); t.lastChild.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ q }) });
    const j = await r.json();
    t.lastChild.textContent = j.a || j.error || 'Hmm, something went wrong.';
    if (j.src === 'ai') {
      const badge = document.createElement('span'); badge.className = 'src';
      badge.textContent = '🤖 AI';
      t.lastChild.appendChild(badge);
    }
  } catch (err) { t.lastChild.textContent = 'Lost the helper server — close and reopen me.'; }
  input.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
}
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  add('me', q); input.value = '';
  ask(q);
});
</script>
</body></html>
