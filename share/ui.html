     this makes sure that even a sanitiser bypass cannot reach the network:

     script/style are allowed because the page is a single self-contained
     file served from the loopback server. -->

<style>
  :root { --bg:#16130d; --panel:#211c13; --line:#3a3223; --ink:#ece7d8; --muted:#9a917d; --ember:#ffb454; --bot:#2a2417; --me:#3d3116; }
  * { box-sizing:border-box; scrollbar-width:none; -ms-overflow-style:none; }

  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }

  .bot pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; }
  .bot a { color: var(--ember); }

  .act:hover { border-color:var(--ember); color:var(--ember); }
  .act.primary { border-color:var(--ember); color:var(--ember); font-weight:600; }
  .progress { font-size:0.72rem; color:var(--muted); margin-left:auto; }
  .src { display:block; margin-top:5px; font-size:0.68rem; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:2px 2px 6px; }
  .chip { background:var(--bot); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:5px 11px; font-size:0.78rem; cursor:pointer; text-align:left; }
  .chip:hover { border-color:var(--ember); color:var(--ember); }
  .cat { width:100%; margin:4px 2px 0; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
  .deeper { display:inline-block; margin-top:6px; font-size:0.74rem; color:var(--ember); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
// Theme palette is baked in server-side (no flash).
document.getElementById('mini').addEventListener('click', () =>
  fetch('/minimize', { method: 'POST' }).catch(() => {}));
// ---- feature-specific consent: each persistent integration is a separate,
// explicit choice made here (the bar click only installed the core).
let SETUP = null;
function featRow(f, compact) {
  const row = document.createElement('div'); row.className = 'feat';
  const txt = document.createElement('div'); txt.className = 'txt';
  txt.innerHTML = '<b>' + f.label + '</b>' + (compact ? '' : '<small>' + f.desc + '</small>');
  const b = document.createElement('button');
  b.textContent = f.installed ? 'On' : 'Enable';
  b.className = f.installed ? 'on' : '';
  b.title = f.installed ? 'Click to disable' : f.desc;
  b.addEventListener('click', () => {
    b.disabled = true; b.textContent = '…';
    fetch('/setup', { method: 'POST', headers: {'Content-Type':'application/json'},
                      body: JSON.stringify({ feature: f.id, enable: !f.installed }) })
      .then(r => r.json()).then(j => { if (j.status) SETUP = j.status; renderSetup(); renderIntegrations(); })
      .catch(() => { b.disabled = false; b.textContent = 'Retry'; });
  });
  row.appendChild(txt); row.appendChild(b); return row;
}
function renderSetup() {
  const old = document.getElementById('setupcard'); if (old) old.remove();
  if (!SETUP || !SETUP.available || SETUP.dismissed) return;
  if (!SETUP.features.some(f => !f.installed)) return;
  const card = document.createElement('div'); card.className = 'msg setup'; card.id = 'setupcard';
  card.innerHTML = '<h3>Optional extras — your call, one by one</h3>';
  SETUP.features.forEach(f => card.appendChild(featRow(f, false)));
  const later = document.createElement('button'); later.className = 'later';
  later.textContent = 'Not now — I can change these later in ⚙';
  later.addEventListener('click', () => {
    fetch('/setup/dismiss', { method: 'POST' }).catch(() => {});
    SETUP.dismissed = true; renderSetup();
  });
  card.appendChild(later);
  chat.insertBefore(card, chat.children[1] || null);
}
function renderIntegrations() {
  const box = document.getElementById('integrations'); box.innerHTML = '';
  if (!SETUP || !SETUP.available) { box.innerHTML = '<small style="color:var(--muted)">managed by Nix &mdash; set these in <code>services.nixi</code> in your Home Manager config</small>'; return; }
  SETUP.features.forEach(f => box.appendChild(featRow(f, true)));
}
function loadSetup() {
  fetch('/setup').then(r => r.json()).then(j => { SETUP = j; renderSetup(); renderIntegrations(); }).catch(() => {});
}
loadSetup();
const tmenu = document.getElementById('trustmenu');
function paintTrust(t) {
  tmenu.querySelectorAll('.lvl').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
document.getElementById('gear').addEventListener('click', () => {
  tmenu.hidden = !tmenu.hidden;
  if (!tmenu.hidden) {
    fetch('/trust').then(r => r.json()).then(j => paintTrust(j.trust)).catch(() => {});
    loadSetup();
  }
});
tmenu.addEventListener('click', (e) => {
  const b = e.target.closest('.lvl'); if (!b) return;
  fetch('/trust', { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ trust: b.dataset.t }) })
    .then(r => r.json()).then(j => { paintTrust(j.trust); setTimeout(() => tmenu.hidden = true, 350); })
    .catch(() => {});
});
document.addEventListener('click', (e) => {
  if (!tmenu.hidden && !e.target.closest('#trustmenu') && !e.target.closest('#gear')) tmenu.hidden = true;
});
// Per-session capability token (server-injected): sent on every request so
// no other origin or process without the token can drive privileged routes.
const TOKEN = '__TOKEN__';
const _nativeFetch = window.fetch.bind(window);
// The server mints a fresh session token every time it starts, so any restart
// (a rebuild, a re-login, systemd's Restart=on-failure) leaves an already-open
// widget holding a dead one and every request 403s. That is recoverable
// without bothering the user: GET / is public and stamps in the current token,
// so reload once. Only once -- a 403 that survives a reload is a real refusal
// (a different user's session), and looping on it would be worse than saying so.
let _reloadedForToken = false;
try { _reloadedForToken = sessionStorage.getItem('nixi-retoken') === '1'; } catch (e) {}
window.fetch = async (url, opts) => {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Nixi-Token': TOKEN }, opts.headers || {});
  const r = await _nativeFetch(url, opts);
  if (r.status === 403) {
    // Throw rather than return: a 403 body is valid JSON, so a caller that
    // does r.json() would happily render "missing capability token" at the
    // user instead of taking its error path.
    if (!_reloadedForToken) {
      _reloadedForToken = true;
      try { sessionStorage.setItem('nixi-retoken', '1'); } catch (e) {}
      location.reload();
      throw new Error('nixi: stale session token, reloading');
    }
    throw new Error('nixi: forbidden');   // survived a reload: a real refusal
  }
  if (r.ok && _reloadedForToken) {
    _reloadedForToken = false;            // recovered; allow a future retry
    try { sessionStorage.removeItem('nixi-retoken'); } catch (e) {}
  }
  return r;
};
const chat = document.getElementById('chat'), form = document.getElementById('f'),
      input = document.getElementById('q');
function md(text) {
  // The industry convention: render the model's actual Markdown.
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  }
  // fallback mini-renderer (vendor files missing)
  let h = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return h.split('\n').map(l => '<div class="ln">' + l + '</div>').join('');
}
const PATHRE = /(?:~|\$HOME|\/(?:etc|usr|opt|var|srv|tmp|home))\/[A-Za-z0-9._+@\/-]*[A-Za-z0-9_+-]/g;
function linkifyPaths(root) {
  // File paths in Nixi's answers become click-to-open links (POST /open).
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  while (w.nextNode()) {
    const n = w.currentNode;
    if (n.parentElement && n.parentElement.closest('a')) continue;
    PATHRE.lastIndex = 0;
    if (PATHRE.test(n.nodeValue)) hits.push(n);
  }
  hits.forEach(n => {
    const s = n.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m; PATHRE.lastIndex = 0;
    while ((m = PATHRE.exec(s))) {
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const a = document.createElement('a');
      a.className = 'path'; a.href = '#'; a.textContent = m[0];
      a.dataset.path = m[0]; a.title = 'Open in your editor';
      frag.appendChild(a); last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
chat.addEventListener('click', (e) => {
  const a = e.target.closest('a.path');
  if (!a) return;
  e.preventDefault();
  fetch('/open', { method: 'POST', headers: {'Content-Type':'application/json'},
                   body: JSON.stringify({ path: a.dataset.path }) }).catch(() => {});
});
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (cls === 'bot') d.innerHTML = '<svg class="avatar"><use href="#bot"/></svg><div></div>', d.lastChild.innerHTML = md(text), linkifyPaths(d.lastChild);
  else d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
let FAQ = [];
fetch('/faq').then(r => r.json()).then(f => {
  if (f && f.ready) return;               // agent connected: no starter chips
  FAQ = (f && f.faq) || f || [];
  if (!FAQ.length) return;
  const box = document.createElement('div'); box.className = 'chips';
  let lastCat = null;
  FAQ.forEach((e) => {
    if (e.cat !== lastCat) {
      const c = document.createElement('div'); c.className = 'cat'; c.textContent = e.cat;
      box.appendChild(c); lastCat = e.cat;
    }
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = e.q;
    b.addEventListener('click', () => {
      add('me', e.q);
      const t = add('bot', e.a);
      const badge = document.createElement('span'); badge.className = 'src';
      badge.textContent = '📖 quick answer · type anything for the AI';
      t.lastChild.appendChild(badge);
      chat.scrollTop = chat.scrollHeight;
    });
    box.appendChild(b);
  });
  chat.insertBefore(box, chat.children[1] || null);
}).catch(() => {});

async function ask(q, act, plan) {
  input.disabled = true;
  const t = add('bot', ''); t.lastChild.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const payload = act ? { q, force: 'act', plan: plan || '' } : { q };
    const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const j = await r.json();
    t.lastChild.innerHTML = md(j.a || j.error || 'Hmm, something went wrong.'), linkifyPaths(t.lastChild);
    const badge = document.createElement('span'); badge.className = 'src';
    if (j.src === 'act') {
      badge.textContent = '🔧 done by Nixi';
      t.lastChild.appendChild(badge);
    } else if (j.src === 'ai') {
      badge.textContent = '❄ AI';
      t.lastChild.appendChild(badge);
      // Offer to apply it: consent = this click, scoped to user-level config.
      const fix = document.createElement('button');
      fix.className = 'deeper'; fix.textContent = '🔧 Do it for me';
      const answerText = j.a || '';
      fix.addEventListener('click', () => {
        fix.remove();
        add('me', '🔧 Do it for me');
        ask(q, true, answerText);
      });
      t.lastChild.appendChild(fix);
    }
  } catch (err) {
    t.lastChild.textContent = _reloadedForToken
      ? 'This widget belongs to another session — close it and open a fresh one.'
      : 'Lost the helper server — close and reopen me.';
  }
  input.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
}
// --- Nixi's mission controls: live tour + learning path -------------
const actions = document.createElement('div'); actions.className = 'actions';
const tourBtn = document.createElement('button'); tourBtn.className = 'act primary'; tourBtn.textContent = '🚀 Live tour';
const learnBtn = document.createElement('button'); learnBtn.className = 'act'; learnBtn.textContent = '🎓 Teach me something new';
const prog = document.createElement('span'); prog.className = 'progress';
actions.append(tourBtn, learnBtn, prog);
chat.insertBefore(actions, chat.children[1] || null);

async function refreshLearn() {
  try {
    const j = await (await fetch('/learn')).json();
    prog.textContent = 'explored ' + j.done + '/' + j.total;
    tourBtn.classList.toggle('primary', !j.toured);
  } catch (e) {}
}
refreshLearn();

// Restore this session's conversation (the widget closes to hide; the
// server remembers).
fetch('/history').then(r => r.json()).then(h => {
  (h.turns || []).forEach(([who, text]) => add(who === 'me' ? 'me' : 'bot', text));
  chat.scrollTop = chat.scrollHeight;
}).catch(() => {});

let TOUR_STEPS = [], tourStep = -1, tourTimer = null;
fetch('/tour/state').then(r => r.json()).then(t => {
  if (t.finished && t.fresh_finish) {
    add('bot', "✅ Tour complete — and you just proved you can always find me. One homework key: **SUPER+K** shows EVERY binding whenever you're lost.\n\nLast thing worth knowing: by default I'm a **Guide** — I explain and instruct, and never change anything on your machine. If you ever want me to apply a fix for you, switch to **Mechanic** in the ⚙ menu: that hands your own agent its normal powers, and I still ask before each fix and back up every file first.\n\nTap 🎓 for your next trick any time, or just ask me things.");
    refreshLearn();
    return;
  }
  if (t.active && !tourTimer) {
    TOUR_STEPS = t.steps || [];
    tourStep = t.step;
    add('bot', "Let me show you what's great about nixarchy — hands-on. I can see what you press, so I'll know when each step is done. " + (TOUR_STEPS[tourStep] || ''));
    tourTimer = setInterval(pollTour, 700);
  }
}).catch(() => {});
tourBtn.addEventListener('click', async () => {
  if (tourTimer) return;
  try {
    const j = await (await fetch('/tour/start', { method: 'POST' })).json();
    TOUR_STEPS = j.steps || [];
    tourStep = 0;
    add('bot', "Let me show you what's great about nixarchy — hands-on. I can see what you press, so I'll know when each step is done. " + TOUR_STEPS[0]);
    tourTimer = setInterval(pollTour, 700);
  } catch (e) { add('bot', 'Could not start the tour — is the helper service running?'); }
});

async function pollTour() {
  try {
    const t = await (await fetch('/tour/state')).json();
    if (t.note) add('bot', t.note);
    while (tourStep < t.step && tourStep < TOUR_STEPS.length) {
      tourStep++;
      if (tourStep < TOUR_STEPS.length) add('bot', '✅ ' + TOUR_STEPS[tourStep]);
    }
    if (t.finished) {
      clearInterval(tourTimer); tourTimer = null;
      add('bot', "✅ Tour complete — and you just proved you can always find me. One homework key: **SUPER+K** shows EVERY binding whenever you're lost.\n\nLast thing worth knowing: by default I'm a **Guide** — I explain and instruct, and never change anything on your machine. If you ever want me to apply a fix for you, switch to **Mechanic** in the ⚙ menu: that hands your own agent its normal powers, and I still ask before each fix and back up every file first.\n\nTap 🎓 for your next trick any time, or just ask me things.");
      refreshLearn();
    } else if (!t.active && tourStep < TOUR_STEPS.length) {
      clearInterval(tourTimer); tourTimer = null;
      add('bot', 'Tour paused — tap 🚀 to pick it up again any time.');
    }
  } catch (e) { clearInterval(tourTimer); tourTimer = null; }
}

learnBtn.addEventListener('click', async () => {
  try {
    const j = await (await fetch('/learn/next', { method: 'POST' })).json();
    if (!j.q) { add('bot', j.msg || 'Nothing left to teach — impressive.'); refreshLearn(); return; }
    add('me', '🎓 ' + j.label);
    ask(j.q);
    refreshLearn();
  } catch (e) {}
});

async function checkPrimed() {
  try {
    const j = await (await fetch('/prime')).json();
    if (j.q) { add('me', j.q); ask(j.q); }
  } catch (e) {}
}
checkPrimed();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkPrimed();
});

// --- voice input ----------------------------------------------------------
// Record here, transcribe on the local server, drop the text in the box. The
// button only appears once /voice says the model and tools are actually
// present, so there is no mic that silently does nothing. Click to start,
// click to stop -- a toggle behaves the same for mouse, touch and keyboard,
// where hold-to-talk loses the clip the moment the pointer slips off.
const mic = document.getElementById('mic');
let recorder = null, chunks = [], micTimer = null;

fetch('/voice').then(r => r.json()).then(j => {
  if (j.ok && navigator.mediaDevices && window.MediaRecorder) mic.classList.add('on');
}).catch(() => {});

function micIdle() {
  mic.setAttribute('aria-pressed', 'false');
  mic.disabled = false;
  mic.textContent = '\u{1F3A4}';
  mic.title = 'Click to talk';
}

async function startRec() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    add('bot', 'I could not open the microphone (' + (e.name || e) +
               '). Allow it for this page, or check SUPER+SPACE → Audio.');
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());   // drops the browser's mic indicator
    clearTimeout(micTimer);
    const blob = new Blob(chunks, { type: recorder.mimeType });
    recorder = null;
    mic.disabled = true; mic.textContent = '…'; mic.title = 'Transcribing…';
    try {
      const buf = new Uint8Array(await blob.arrayBuffer());
      // Chunked: String.fromCharCode(...buf) overflows the stack on a long clip.
      let s = '';
      for (let i = 0; i < buf.length; i += 8192) s += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
      const j = await (await fetch('/transcribe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ audio: btoa(s) }) })).json();
      if (j.error) add('bot', j.error);
      else if (!j.text) add('bot', "I didn't catch any speech in that — try again a bit closer to the mic.");
      // Into the input box, never straight to ask(): in Mechanic mode a single
      // misheard word would act on the machine. The human reads it, then Enter.
      else input.value = input.value ? input.value + ' ' + j.text : j.text;
    } catch (e) {
      add('bot', 'Voice failed: ' + e.message);
    }
    micIdle(); input.focus();
  };
  recorder.start();
  mic.setAttribute('aria-pressed', 'true');
  mic.textContent = '⏹'; mic.title = 'Stop and transcribe';
  // Hard cap, matching the server's clip limit, so a forgotten open mic stops.
  micTimer = setTimeout(() => {
    if (recorder && recorder.state === 'recording') recorder.stop();
  }, 60000);
}

mic.addEventListener('click', () => {
  if (recorder && recorder.state === 'recording') recorder.stop();
  else startRec();
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  add('me', q); input.value = '';
  ask(q);
});
</script>
