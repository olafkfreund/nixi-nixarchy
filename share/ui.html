<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archy — Omarchy Helper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-1.5 -3 14 14'><g fill='%23ffb454'><rect x='2' y='0' width='1' height='1'/><rect x='8' y='0' width='1' height='1'/><rect x='3' y='1' width='1' height='1'/><rect x='7' y='1' width='1' height='1'/><rect x='2' y='2' width='1' height='1'/><rect x='3' y='2' width='1' height='1'/><rect x='4' y='2' width='1' height='1'/><rect x='5' y='2' width='1' height='1'/><rect x='6' y='2' width='1' height='1'/><rect x='7' y='2' width='1' height='1'/><rect x='8' y='2' width='1' height='1'/><rect x='1' y='3' width='1' height='1'/><rect x='2' y='3' width='1' height='1'/><rect x='4' y='3' width='1' height='1'/><rect x='5' y='3' width='1' height='1'/><rect x='6' y='3' width='1' height='1'/><rect x='8' y='3' width='1' height='1'/><rect x='9' y='3' width='1' height='1'/><rect x='0' y='4' width='1' height='1'/><rect x='1' y='4' width='1' height='1'/><rect x='2' y='4' width='1' height='1'/><rect x='3' y='4' width='1' height='1'/><rect x='4' y='4' width='1' height='1'/><rect x='5' y='4' width='1' height='1'/><rect x='6' y='4' width='1' height='1'/><rect x='7' y='4' width='1' height='1'/><rect x='8' y='4' width='1' height='1'/><rect x='9' y='4' width='1' height='1'/><rect x='10' y='4' width='1' height='1'/><rect x='0' y='5' width='1' height='1'/><rect x='2' y='5' width='1' height='1'/><rect x='3' y='5' width='1' height='1'/><rect x='4' y='5' width='1' height='1'/><rect x='5' y='5' width='1' height='1'/><rect x='6' y='5' width='1' height='1'/><rect x='7' y='5' width='1' height='1'/><rect x='8' y='5' width='1' height='1'/><rect x='10' y='5' width='1' height='1'/><rect x='0' y='6' width='1' height='1'/><rect x='2' y='6' width='1' height='1'/><rect x='8' y='6' width='1' height='1'/><rect x='10' y='6' width='1' height='1'/><rect x='3' y='7' width='1' height='1'/><rect x='4' y='7' width='1' height='1'/><rect x='6' y='7' width='1' height='1'/><rect x='7' y='7' width='1' height='1'/></g></svg>">
<style>
  :root { --bg:#16130d; --panel:#211c13; --line:#3a3223; --ink:#ece7d8; --muted:#9a917d; --ember:#ffb454; --bot:#2a2417; --me:#3d3116; }
  * { box-sizing:border-box; scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar { display:none; }
  html, body { overflow:hidden; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .avatar { width:34px; height:34px; }
  header h1 { font-size:0.95rem; margin:0; }
  header p { font-size:0.72rem; margin:0; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  /* scrolling without the visible bar */
  #chat { scrollbar-width:none; -ms-overflow-style:none; }
  #chat::-webkit-scrollbar { display:none; }
  /* flat transcript — no bubbles; long strings hard-wrap inside the column */
  .msg { width:100%; min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .me { white-space:pre-wrap; color:var(--ember); font-weight:500; padding-left:2px; margin-top:6px; }
  .me::before { content:"› "; opacity:0.7; }
  .msg .ln { margin-top:4px; }
  .msg .ln:first-child, .msg .li:first-child { margin-top:0; }
  .msg .gap { height:7px; }
  .bot { display:flex; gap:10px; align-self:stretch; }
  .bot .avatar { width:20px; height:20px; flex:none; margin-top:2px; opacity:0.9; }
  .bot > div { flex:1; min-width:0; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 1.5px; border-radius:50%; background:var(--ember); animation:b 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
  form { display:flex; gap:8px; padding:12px; background:var(--panel); border-top:1px solid var(--line); }
  input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; color:var(--ink); font:inherit; outline:none; }
  input:focus { border-color:var(--ember); }
  input:disabled { opacity:.5; }
  #mini { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:2px 10px; font-weight:700; line-height:1.4; }
  #mini:hover { color:var(--ember); border-color:var(--ember); }
  .hint { align-self:center; color:var(--muted); font-size:0.72rem; }
  .deeper { display:inline-block; margin-top:6px; margin-left:10px; font-size:0.74rem; color:var(--ember); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 1.35em; }
  .bot li { margin: 3px 0; }
  .bot li::marker { color: var(--ember); }
  .bot h1, .bot h2, .bot h3, .bot h4 { font-size: 0.95em; color: var(--ember); margin: 10px 0 4px; }
  .bot pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; }
  .bot a { color: var(--ember); }
  .bot a.path { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
  .bot strong { color: var(--ember); font-weight: 600; }
  .bot blockquote { margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); }
  .msg .li { padding-left: 1.1em; position: relative; margin-top: 5px; }
  .msg .li::before { content: "•"; position: absolute; left: 0.2em; color: var(--ember); }
  .msg code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; font-size: 0.85em; }
  .msg b { color: var(--ember); font-weight: 600; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:0 2px 4px; }
  .act { background:var(--bot); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:0.8rem; cursor:pointer; }
  .act:hover { border-color:var(--ember); color:var(--ember); }
  .act.primary { border-color:var(--ember); color:var(--ember); font-weight:600; }
  .progress { font-size:0.72rem; color:var(--muted); margin-left:auto; }
  .src { display:block; margin-top:5px; font-size:0.68rem; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:2px 2px 6px; }
  .chip { background:var(--bot); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:5px 11px; font-size:0.78rem; cursor:pointer; text-align:left; }
  .chip:hover { border-color:var(--ember); color:var(--ember); }
  .cat { width:100%; margin:4px 2px 0; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
  .deeper { display:inline-block; margin-top:6px; font-size:0.74rem; color:var(--ember); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }
/*__THEME__*/
</style></head>
<body>
<svg style="display:none"><symbol id="bot" viewBox="0 0 48 48">
  <rect x="10" y="14" width="28" height="22" rx="7" style="fill:var(--bot);stroke:var(--ember)" stroke-width="2.2"/>
  <circle cx="19" cy="25" r="3.2" style="fill:var(--ember)"/><circle cx="29" cy="25" r="3.2" style="fill:var(--ember)"/>
  <path d="M18 31.5c2 1.8 10 1.8 12 0" style="stroke:var(--ember)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="24" y1="14" x2="24" y2="8" style="stroke:var(--ember)" stroke-width="2.2"/><circle cx="24" cy="6.5" r="2.4" style="fill:var(--ember)"/>
  <line x1="10" y1="24" x2="5" y2="24" style="stroke:var(--ember)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="43" y2="24" style="stroke:var(--ember)" stroke-width="2.2" stroke-linecap="round"/>
</symbol></svg>
<header>
  <svg class="avatar"><use href="#bot"/></svg>
  <div style="flex:1"><h1>Archy</h1><p>your Omarchy guide</p></div>
  <button id="mini" title="Minimize (bring back with your helper key)" aria-label="Minimize">&#8212;</button>
</header>
<div id="chat">
  <div class="msg bot"><svg class="avatar"><use href="#bot"/></svg><div>__GREETING__</div></div>
  <div class="hint">__HINT__</div>
</div>
<form id="f">
  <input id="q" autocomplete="off" placeholder="Type a question and press Enter…" autofocus>
</form>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
// Theme palette is baked in server-side (no flash).
document.getElementById('mini').addEventListener('click', () =>
  fetch('/minimize', { method: 'POST' }).catch(() => {}));
const chat = document.getElementById('chat'), form = document.getElementById('f'),
      input = document.getElementById('q');
function md(text) {
  // The industry convention: render the model's actual Markdown.
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  }
  // fallback mini-renderer (vendor files missing)
  let h = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return h.split('\n').map(l => '<div class="ln">' + l + '</div>').join('');
}
const PATHRE = /(?:~|\$HOME|\/(?:etc|usr|opt|var|srv|tmp|home))\/[A-Za-z0-9._+@\/-]*[A-Za-z0-9_+-]/g;
function linkifyPaths(root) {
  // File paths in Archy's answers become click-to-open links (POST /open).
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  while (w.nextNode()) {
    const n = w.currentNode;
    if (n.parentElement && n.parentElement.closest('a')) continue;
    PATHRE.lastIndex = 0;
    if (PATHRE.test(n.nodeValue)) hits.push(n);
  }
  hits.forEach(n => {
    const s = n.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m; PATHRE.lastIndex = 0;
    while ((m = PATHRE.exec(s))) {
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const a = document.createElement('a');
      a.className = 'path'; a.href = '#'; a.textContent = m[0];
      a.dataset.path = m[0]; a.title = 'Open in your editor';
      frag.appendChild(a); last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
chat.addEventListener('click', (e) => {
  const a = e.target.closest('a.path');
  if (!a) return;
  e.preventDefault();
  fetch('/open', { method: 'POST', headers: {'Content-Type':'application/json'},
                   body: JSON.stringify({ path: a.dataset.path }) }).catch(() => {});
});
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (cls === 'bot') d.innerHTML = '<svg class="avatar"><use href="#bot"/></svg><div></div>', d.lastChild.innerHTML = md(text), linkifyPaths(d.lastChild);
  else d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
let FAQ = [];
fetch('/faq').then(r => r.json()).then(f => {
  if (f && f.ready) return;               // agent connected: no starter chips
  FAQ = (f && f.faq) || f || [];
  if (!FAQ.length) return;
  const box = document.createElement('div'); box.className = 'chips';
  let lastCat = null;
  FAQ.forEach((e) => {
    if (e.cat !== lastCat) {
      const c = document.createElement('div'); c.className = 'cat'; c.textContent = e.cat;
      box.appendChild(c); lastCat = e.cat;
    }
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = e.q;
    b.addEventListener('click', () => {
      add('me', e.q);
      const t = add('bot', e.a);
      const badge = document.createElement('span'); badge.className = 'src';
      badge.textContent = '📖 quick answer · type anything for the AI';
      t.lastChild.appendChild(badge);
      chat.scrollTop = chat.scrollHeight;
    });
    box.appendChild(b);
  });
  chat.insertBefore(box, chat.children[1] || null);
}).catch(() => {});

async function ask(q, act, plan) {
  input.disabled = true;
  const t = add('bot', ''); t.lastChild.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const payload = act ? { q, force: 'act', plan: plan || '' } : { q };
    const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const j = await r.json();
    t.lastChild.innerHTML = md(j.a || j.error || 'Hmm, something went wrong.'), linkifyPaths(t.lastChild);
    const badge = document.createElement('span'); badge.className = 'src';
    if (j.src === 'act') {
      badge.textContent = '🔧 done by Archy';
      t.lastChild.appendChild(badge);
    } else if (j.src === 'ai') {
      badge.textContent = '🤖 AI';
      t.lastChild.appendChild(badge);
      // Offer to apply it: consent = this click, scoped to user-level config.
      const fix = document.createElement('button');
      fix.className = 'deeper'; fix.textContent = '🔧 Do it for me';
      const answerText = j.a || '';
      fix.addEventListener('click', () => {
        fix.remove();
        add('me', '🔧 Do it for me');
        ask(q, true, answerText);
      });
      t.lastChild.appendChild(fix);
    }
  } catch (err) { t.lastChild.textContent = 'Lost the helper server — close and reopen me.'; }
  input.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
}
// --- Archy's mission controls: live tour + learning path -------------
const actions = document.createElement('div'); actions.className = 'actions';
const tourBtn = document.createElement('button'); tourBtn.className = 'act primary'; tourBtn.textContent = '🚀 Live tour';
const learnBtn = document.createElement('button'); learnBtn.className = 'act'; learnBtn.textContent = '🎓 Teach me something new';
const prog = document.createElement('span'); prog.className = 'progress';
actions.append(tourBtn, learnBtn, prog);
chat.insertBefore(actions, chat.children[1] || null);

async function refreshLearn() {
  try {
    const j = await (await fetch('/learn')).json();
    prog.textContent = 'explored ' + j.done + '/' + j.total;
    tourBtn.classList.toggle('primary', !j.toured);
  } catch (e) {}
}
refreshLearn();

// Restore this session's conversation (the widget closes to hide; the
// server remembers).
fetch('/history').then(r => r.json()).then(h => {
  (h.turns || []).forEach(([who, text]) => add(who === 'me' ? 'me' : 'bot', text));
  chat.scrollTop = chat.scrollHeight;
}).catch(() => {});

let TOUR_STEPS = [], tourStep = -1, tourTimer = null;
fetch('/tour/state').then(r => r.json()).then(t => {
  if (t.finished && t.fresh_finish) {
    add('bot', "✅ Tour complete — and you just proved you can always find me. One homework key: SUPER+K shows EVERY binding whenever you're lost. Tap 🎓 for your next trick any time, or just ask me things.");
    refreshLearn();
    return;
  }
  if (t.active && !tourTimer) {
    TOUR_STEPS = t.steps || [];
    tourStep = t.step;
    add('bot', "Let me show you what's great about Omarchy — hands-on. I can see what you press, so I'll know when each step is done. " + (TOUR_STEPS[tourStep] || ''));
    tourTimer = setInterval(pollTour, 700);
  }
}).catch(() => {});
tourBtn.addEventListener('click', async () => {
  if (tourTimer) return;
  try {
    const j = await (await fetch('/tour/start', { method: 'POST' })).json();
    TOUR_STEPS = j.steps || [];
    tourStep = 0;
    add('bot', "Let me show you what's great about Omarchy — hands-on. I can see what you press, so I'll know when each step is done. " + TOUR_STEPS[0]);
    tourTimer = setInterval(pollTour, 700);
  } catch (e) { add('bot', 'Could not start the tour — is the helper service running?'); }
});

async function pollTour() {
  try {
    const t = await (await fetch('/tour/state')).json();
    if (t.note) add('bot', t.note);
    while (tourStep < t.step && tourStep < TOUR_STEPS.length) {
      tourStep++;
      if (tourStep < TOUR_STEPS.length) add('bot', '✅ ' + TOUR_STEPS[tourStep]);
    }
    if (t.finished) {
      clearInterval(tourTimer); tourTimer = null;
      add('bot', "✅ Tour complete — and you just proved you can always find me. One homework key: SUPER+K shows EVERY binding whenever you're lost. Tap 🎓 for your next trick any time, or just ask me things.");
      refreshLearn();
    } else if (!t.active && tourStep < TOUR_STEPS.length) {
      clearInterval(tourTimer); tourTimer = null;
      add('bot', 'Tour paused — tap 🚀 to pick it up again any time.');
    }
  } catch (e) { clearInterval(tourTimer); tourTimer = null; }
}

learnBtn.addEventListener('click', async () => {
  try {
    const j = await (await fetch('/learn/next', { method: 'POST' })).json();
    if (!j.q) { add('bot', j.msg || 'Nothing left to teach — impressive.'); refreshLearn(); return; }
    add('me', '🎓 ' + j.label);
    ask(j.q);
    refreshLearn();
  } catch (e) {}
});

async function checkPrimed() {
  try {
    const j = await (await fetch('/prime')).json();
    if (j.q) { add('me', j.q); ask(j.q); }
  } catch (e) {}
}
checkPrimed();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkPrimed();
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  add('me', q); input.value = '';
  ask(q);
});
</script>
</body></html>
