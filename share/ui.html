<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omarchy Helper</title>
<style>
  :root { --bg:#16130d; --panel:#211c13; --line:#3a3223; --ink:#ece7d8; --muted:#9a917d; --ember:#ffb454; --bot:#2a2417; --me:#3d3116; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .avatar { width:34px; height:34px; }
  header h1 { font-size:0.95rem; margin:0; }
  header p { font-size:0.72rem; margin:0; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:86%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start; display:flex; gap:8px; }
  .bot .avatar { width:22px; height:22px; flex:none; margin-top:2px; }
  .me { background:var(--me); border:1px solid var(--line); border-bottom-right-radius:4px; align-self:flex-end; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 1.5px; border-radius:50%; background:var(--ember); animation:b 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
  form { display:flex; gap:8px; padding:12px; background:var(--panel); border-top:1px solid var(--line); }
  input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; color:var(--ink); font:inherit; outline:none; }
  input:focus { border-color:var(--ember); }
  button { background:var(--ember); border:none; border-radius:12px; padding:0 16px; font-weight:700; color:#1a1206; cursor:pointer; }
  button:disabled { opacity:.5; }
  .hint { align-self:center; color:var(--muted); font-size:0.72rem; }
</style></head>
<body>
<svg style="display:none"><symbol id="bot" viewBox="0 0 48 48">
  <rect x="10" y="14" width="28" height="22" rx="7" fill="#2a2417" stroke="#ffb454" stroke-width="2.2"/>
  <circle cx="19" cy="25" r="3.2" fill="#ffb454"/><circle cx="29" cy="25" r="3.2" fill="#ffb454"/>
  <path d="M18 31.5c2 1.8 10 1.8 12 0" stroke="#ffb454" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="24" y1="14" x2="24" y2="8" stroke="#ffb454" stroke-width="2.2"/><circle cx="24" cy="6.5" r="2.4" fill="#ffb454"/>
  <line x1="10" y1="24" x2="5" y2="24" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="43" y2="24" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round"/>
</symbol></svg>
<header>
  <svg class="avatar"><use href="#bot"/></svg>
  <div><h1>Omarchy Helper</h1><p>ask me anything about your system</p></div>
</header>
<div id="chat">
  <div class="msg bot"><svg class="avatar"><use href="#bot"/></svg><div>Hey! I'm your Omarchy helper 🤖 Ask me anything — "how do workspaces work?", "what key does X?", "how do I install an app?"</div></div>
  <div class="hint">answers are grounded in this machine's real setup</div>
</div>
<form id="f">
  <input id="q" autocomplete="off" placeholder="Type a question…" autofocus>
  <button id="send">Ask</button>
</form>
<script>
const chat = document.getElementById('chat'), form = document.getElementById('f'),
      input = document.getElementById('q'), send = document.getElementById('send');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (cls === 'bot') d.innerHTML = '<svg class="avatar"><use href="#bot"/></svg><div></div>', d.lastChild.textContent = text;
  else d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  add('me', q); input.value = ''; send.disabled = true;
  const t = add('bot', ''); t.lastChild.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ q }) });
    const j = await r.json();
    t.lastChild.textContent = j.a || j.error || 'Hmm, something went wrong.';
  } catch (err) { t.lastChild.textContent = 'Lost the helper server — close and reopen me.'; }
  send.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
});
</script>
</body></html>
