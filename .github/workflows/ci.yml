name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix flake check (build + self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        continue-on-error: true

      # Builds the package (which runs its installCheckPhase) and the
      # behavioural self-check derivation.
      - run: nix flake check --print-build-logs

  bridge:
    name: Bridge tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Node from the flake's own nixpkgs, the same major the package runs.
      - name: npm ci and node --test
        run: |
          nix shell --inputs-from . nixpkgs#nodejs \
            -c bash -c 'cd bridge && npm ci --no-audit --no-fund && node --test ./*.test.js'

  home-manager:
    name: Home Manager module evaluates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        continue-on-error: true

      # The module is the documented install path, so a broken option or a
      # bad unit must fail the build, not the user's `home-manager switch`.
      # Two configurations: the default agents need allowUnfree
      # (claude-agent-acp pulls in claude-code); `agents = [ ]` must not.
      - name: Build activation packages (default agents; no agents without unfree)
        run: |
          mkdir -p /tmp/hm && cd /tmp/hm
          cat > flake.nix <<'NIX'
          {
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
              home-manager.url = "github:nix-community/home-manager";
              home-manager.inputs.nixpkgs.follows = "nixpkgs";
              nixi.url = "path:@SRC@";
              nixi.inputs.nixpkgs.follows = "nixpkgs";
            };
            outputs = { nixpkgs, home-manager, nixi, ... }:
              let
                mk = unfree: settings: home-manager.lib.homeManagerConfiguration {
                  pkgs = import nixpkgs { system = "x86_64-linux"; config.allowUnfree = unfree; };
                  modules = [
                    nixi.homeModules.default
                    {
                      home = { username = "ci"; homeDirectory = "/home/ci"; stateVersion = "24.05"; };
                      services.nixi = { enable = true; } // settings;
                    }
                  ];
                };
              in {
                homeConfigurations.full = mk true {
                  agents = [ "claude" "codex" "opencode" ];
                  watcher.enable = true;
                  omarchyHooks.enable = true;
                  menuEntry.enable = true;
                };
                # No agents set: the default must still evaluate without unfree.
                homeConfigurations.free = mk false { };
              };
          }
          NIX
          sed -i "s|@SRC@|$GITHUB_WORKSPACE|" flake.nix
          full=$(nix build .#homeConfigurations.full.activationPackage \
            --no-link --print-out-paths --print-build-logs)
          nix build .#homeConfigurations.free.activationPackage --no-link --print-build-logs
          files="$full/home-files/.config"
          test -L "$files/omarchy/plugins/io.github.olafkfreund.nixi"
          test -L "$files/omarchy/plugins/io.github.olafkfreund.nixi-button"
          wrapper="$files/omarchy/plugins/io.github.olafkfreund.nixi/bridge/nixi-node"
          for v in NIXI_CLAUDE_ACP_COMMAND NIXI_CODEX_ACP_COMMAND NIXI_OPENCODE_COMMAND; do
            grep -q "$v" "$wrapper" || { echo "adapter not pinned: $v"; exit 1; }
          done
          test ! -e "$files/systemd/user/nixi.service" || { echo "the server unit is back"; exit 1; }
          echo "home-manager OK"

  lint:
    name: Lint (python, shell, actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: ruff
        run: |
          pipx install ruff
          # The programs in bin/ have no .py suffix, so copy them somewhere
          # ruff will actually look at.
          tmp=$(mktemp -d)
          for f in bin/nixi-watch bin/nixi-update-manual bin/nixi-context; do
            cp "$f" "$tmp/$(basename "$f").py"
          done
          ruff check --select=F,B,E9,E71,E72 --output-format=concise \
            "$tmp" install.py tools/ bin/nixi_safeio.py

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/nixi install.sh hooks/*.hook

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  installer:
    name: Imperative installer (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # --no-systemd places files without touching a user manager; a throwaway
      # HOME keeps the runner's own dotfiles out of it. NIXI_SKIP_MANUAL keeps
      # this deterministic (the fetch is rate limited per runner IP and covered
      # by `manual` below); NIXI_SKIP_NPM keeps it offline -- `bridge` runs npm.
      - name: install.py --all into a throwaway HOME
        env:
          NIXI_SKIP_MANUAL: '1'
          NIXI_SKIP_NPM: '1'
        run: |
          fake=$(mktemp -d)
          # install.py places into ~/.config/nixi with dir_mode=0o700 and _dir_ok
          # rejects a group/world-writable destination, so pre-create it 0700.
          mkdir -p "$fake/.config/nixi"
          chmod 700 "$fake/.config/nixi"
          HOME="$fake" python3 install.py --no-systemd --all | tee /tmp/install.log
          HOME="$fake" python3 install.py --no-systemd --status | tee /tmp/status.json
          python3 - <<'PY'
          import json
          s = json.load(open("/tmp/status.json"))
          assert s == {"watcher": True, "skill": True, "hooks": True}, s
          print("installer status OK:", s)
          PY
          grep -q "agents with an ACP adapter on PATH" /tmp/install.log
          for f in .local/bin/nixi .local/bin/nixi-context .config/nixi/CLAUDE.md \
                   .config/omarchy/plugins/io.github.olafkfreund.nixi-button/BarWidget.qml \
                   .claude/skills/nixi/SKILL.md; do
            test -e "$fake/$f" || { echo "missing $f"; exit 1; }
          done
          echo "installer placed everything it claims to"

  manual:
    name: Manual fetch (network, non-blocking)
    runs-on: ubuntu-latest
    # Hits api.github.com unauthenticated, so it is rate limited by runner IP.
    # It must not be able to fail a PR -- it exists to notice when either
    # upstream repo moves its manual, not to gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch and hash-verify both manuals
        run: |
          data=$(mktemp -d -p "$HOME") && chmod 700 "$data"
          NIXI_DATA="$data" python3 bin/nixi-update-manual
          # nixarchy must win the pages it overrides, omarchy must backfill.
          test -f "$data/manual/per-project-environments.md"   # nixarchy only
          test -f "$data/manual/hotkeys.md"                    # omarchy backfill
          grep -q 'olafkfreund/nixarchy' "$data/manual/.fetched"
          grep -q 'omacom/omarchy-site' "$data/manual/.fetched"
          echo "pages: $(find "$data/manual" -name '*.md' | wc -l)"
