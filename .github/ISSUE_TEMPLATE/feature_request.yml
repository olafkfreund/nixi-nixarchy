name: Feature request
description: Suggest something Nixi should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution — it usually suggests a simpler fix.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
